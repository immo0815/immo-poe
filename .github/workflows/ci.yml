name: CI

# THE REPOSITORY IS PRIVATE AGAIN (immo0815/immo-poe, since 2026-10-11), so every minute here
# comes out of the account's monthly allowance - 2,000 on the free plan - and Windows minutes
# cost more than Linux ones. Worth recording what running out looks like, because it looks
# nothing like a billing problem: jobs fail in about three seconds with `runner_id: 0`, no
# runner name and NO STEP LIST AT ALL - never dispatched to a machine. That is
# indistinguishable at a glance from a transient Actions outage, and the only thing that tells
# them apart is that an outage recovers on its own. It happened once already, the last time
# this repository was private.
#
# Measured on the import commit: test 7:20 on Linux, aot-publish 4:30 and gpu-test 2:30 on
# Windows. So the run is cut where it was paying twice:
# - push only on main, pull requests through pull_request (until 2026-10-28 - see below). Both
#   on every branch ran the whole workflow TWICE for each push to a branch with an open pull
#   request - same commit, same answer, double the minutes.
# - the two Windows jobs only after the merge (and by hand), not on every pull-request push.
#   That is a trade, chosen deliberately: an AOT or GPU break now shows on main after the merge
#   instead of on the pull request. Run this workflow by hand on a branch (workflow_dispatch)
#   when a change is likely to touch either - ILC-sensitive dependencies, the shaders.
#   A hand run on a branch that has a pull request runs the Windows jobs AND repeats the test
#   job the pull request already ran - so it is for those changes only, not every push: run
#   after every push, it used up the month's allowance on 2026-10-12.
#
# WHERE THE JOBS RUN is a repository variable, not this file (asked for from the live client,
# 2026-10-12, when that allowance ran out): LINUX_RUNNER and WINDOWS_RUNNER, each a JSON list of
# runner labels - ["self-hosted","Linux","X64"] for a runner in WSL on the developer's machine,
# ["self-hosted","Windows","X64"] for one on the same machine's Windows - and GitHub's own
# ubuntu-latest and windows-latest where unset. Self-hosted runners cost no minutes. Deleting
# the variables (Settings, Secrets and variables, Actions, Variables) puts every job back on
# GitHub's machines; publish.yml and bake-boss-icons.yml read the same LINUX_RUNNER.
#
# THE SELF-HOSTED RUNNERS ARE THE DEVELOPER'S OWN MACHINE, one a system, so every job queues
# behind the last (asked for from the live client, 2026-10-28, when a merge took over a quarter
# of an hour). Measured on #109's merge: test 3:20 (build 1:16, tests 1:54), aot-publish 2:14,
# gpu-test 2:41 - and the test job WAITED 8:16 for the Linux runner, busy with the pull
# request's own test run, a hand run of the whole workflow on the branch and publish.yml. So:
# - NO PULL-REQUEST RUN: pull requests are merged as soon as they are opened, and the run on
#   main tests the same code again a minute later. The trade, chosen from the live client: a
#   failure shows on main after the merge, not before it. A hand run (workflow_dispatch) on a
#   branch still asks before a merge where that is worth a run - the Windows jobs above.
# - NOT FOR DOCUMENTATION ALONE: a push changing only Markdown runs nothing here (no test reads
#   one); publish.yml still runs, so the build stamp follows the commit.
# - A NEWER RUN CANCELS AN OLDER ONE on the same ref still running or waiting: of two merges a
#   minute apart only the second is worth its quarter of an hour.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  # Useful for re-running a suspected-flaky job without pushing an empty commit, and for
  # asking the Windows jobs about a branch before it is merged.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ vars.LINUX_RUNNER && fromJSON(vars.LINUX_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
        # ON A SELF-HOSTED RUNNER the default install folder (/usr/share/dotnet, C:\Program Files\dotnet)
        # is not the runner's to write - see the runner note in ci.yml. Its own tool cache is, and keeps
        # the SDK between runs. Empty on GitHub's machines, which leaves the default as it was.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.environment == 'self-hosted' && format('{0}/dotnet', runner.tool_cache) || '' }}
      # EnableWindowsTargeting in Directory.Build.props lets the net10.0-windows
      # projects compile here too, so the whole solution is checked on every push.
      # IN RELEASE, which is what ships (aot-publish below is -c Release) and what the replay tests
      # need: they walk a recording frame by frame through ReplayMemoryReader, and measured on the
      # sweep capture the same walk is 51 s unoptimised against 17.7 s optimised - four fifths of the
      # unoptimised time inside TryRead. Nothing in the repository reads the configuration (no
      # #if DEBUG, no Debug.Assert), so the tests ask the same questions of the same code. Measured
      # on four cores at 0.1.345: the whole suite 2:07 in Debug, 1:13 in Release, 4607 tests either way.
      - run: dotnet build -c Release --nologo
      - run: dotnet test -c Release --nologo --no-build

  # THE GRAPHICS CARD'S PICTURES held against the processor's (src/PoEformance.Gpu against
  # MeshPicture), on WARP - Windows' own Direct3D 11 run on the processor, which every Windows
  # runner has and which draws exactly what the rules say a card must. The only place the card's
  # shaders are compiled and run before they reach somebody's machine: the Linux job builds the
  # code, but Direct3D and its shader compiler are Windows'. Its own job, after test, for the
  # reasons the AOT job below gives.
  gpu-test:
    needs: test
    runs-on: ${{ vars.WINDOWS_RUNNER && fromJSON(vars.WINDOWS_RUNNER) || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
        # ON A SELF-HOSTED RUNNER the default install folder (/usr/share/dotnet, C:\Program Files\dotnet)
        # is not the runner's to write - see the runner note in ci.yml. Its own tool cache is, and keeps
        # the SDK between runs. Empty on GitHub's machines, which leaves the default as it was.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.environment == 'self-hosted' && format('{0}/dotnet', runner.tool_cache) || '' }}
      - run: dotnet test tests/PoEformance.Gpu.Tests --nologo

  # THE Native AOT gate - the deployment risk this project carries, measured on every
  # merge to main (and on request) instead of discovered at ship time. Publishing with PublishAot compiles the
  # whole dependency graph through ILC: the overlay stack (ClickableTransparentOverlay,
  # ImGui.NET, Vortice), the WebView2 config window (source-generated COM), and our own
  # code. A failure here is real information about exactly which dependency breaks AOT;
  # green here means the ONLY remaining AOT question is runtime behaviour, which needs a
  # live Windows run. Cross-OS AOT publishing is unsupported, hence the Windows runner.
  #
  # Waits for test, which is what the question needs anyway: "does this compile through
  # ILC" is not worth asking about code that does not compile through Roslyn, and a broken
  # build otherwise fails here too and reports it as an AOT problem. Starting after test
  # also stops the two jobs racing each other through GitHub's action-resolution service,
  # which is where CI #95 and #96 both died - "Failed to resolve action download info,
  # Service Unavailable", before checkout, while the ubuntu job resolved the same two
  # actions in the same minute. That is GitHub's infrastructure and not something a
  # workflow can fix, so this is not offered as the cure; it just removes one way to
  # collide, and it is the right shape regardless.
  aot-publish:
    needs: test
    runs-on: ${{ vars.WINDOWS_RUNNER && fromJSON(vars.WINDOWS_RUNNER) || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
        # ON A SELF-HOSTED RUNNER the default install folder (/usr/share/dotnet, C:\Program Files\dotnet)
        # is not the runner's to write - see the runner note in ci.yml. Its own tool cache is, and keeps
        # the SDK between runs. Empty on GitHub's machines, which leaves the default as it was.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.environment == 'self-hosted' && format('{0}/dotnet', runner.tool_cache) || '' }}
      - run: dotnet publish src/PoEformance.App -c Release -r win-x64 -p:PublishAot=true
      - name: Show what AOT produced
        # Windows PowerShell, not pwsh: a self-hosted runner's service runs as the network service,
        # which does not see a PowerShell 7 installed for one user ("pwsh: command not found" after a
        # green ILC compile). 5.1 ships with every Windows, GitHub's machines included, and runs this.
        shell: powershell
        run: |
          $out = "src/PoEformance.App/bin/Release/net10.0-windows/win-x64/publish"
          Get-ChildItem $out -Recurse -File | Select-Object @{n='file';e={$_.FullName.Substring($out.Length+1)}}, @{n='KB';e={[math]::Round($_.Length/1KB)}} | Format-Table -AutoSize
          if (-not (Test-Path "$out/PoEformance.App.exe")) { throw "no exe produced" }

      # KEEP THE BINARY. This job already builds a complete, runnable tool and then throws
      # it away, so the only way to get one has been to build it on a Windows machine with
      # the SDK installed - which is exactly the machine somebody asking for a build tends
      # not to have. Publishing the whole directory rather than the exe alone, because the
      # exe alone does not run: it needs cimgui.dll, WebView2Loader.dll and oo2core.dll
      # beside it, the data tables, the ui pages, and above all schema/poe2.offsets.json,
      # which is where this project keeps the offsets it reads the game through.
      #
      # The .pdb files come along deliberately. They are the bulk of the download, and they
      # are also the difference between a crash report naming a line and one naming a bare
      # address - which, in a Native AOT binary reading another process's memory, is the
      # difference between a diagnosable report and an unusable one.
      #
      # Named by run number so two builds downloaded on the same day cannot be confused.
      # Running yesterday's exe while believing it is today's is the kind of mistake that
      # costs an afternoon here, because the symptom is a wrong offset, not a wrong version.
      #
      # ALLOWED TO FAIL, like the publish workflow's copy, and for the same reason: artifact
      # STORAGE is metered too in a private repository - 500 MB on the free plan - and this is
      # about 46 MB a run kept for two weeks, beside publish's 52 MB kept for one. A handful of
      # merges in a week fills it, and then this upload fails. The AOT publish above has already
      # answered the question this job exists for; a full store must not turn that answer red.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PoEformance-win-x64-${{ github.run_number }}
          path: src/PoEformance.App/bin/Release/net10.0-windows/win-x64/publish
          if-no-files-found: error
          retention-days: 14
